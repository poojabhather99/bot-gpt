name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DB_PATH: test.db
        run: python -m pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t botgpt-api -f Dockerfile .

      - name: Build UI image
        run: docker build -t botgpt-ui -f Dockerfile.streamlit .

      - name: Smoke test API container
        run: |
          docker run -d --name botgpt-api-test \
            -e GROQ_API_KEY=dummy \
            -e DB_PATH=/tmp/test.db \
            -p 8000:8000 botgpt-api
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker stop botgpt-api-test