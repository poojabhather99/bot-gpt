services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: botgpt-api
    ports:
      - "8000:8000"
    volumes:
      - db_data:/data
    env_file:
      - .env
    environment:
      - DB_PATH=/data/qa_assistant.db
    restart: unless-stopped
    networks:
      - botgpt-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: botgpt-ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://botgpt-api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - botgpt-network

networks:
  botgpt-network:
    driver: bridge

volumes:
  db_data: